# SINGLE SOURCE OF TRUTH for the application's structure (see docs/adr/0010-single-source-of-truth.md).
# Edit this file, then run scripts/generate. Never repeat these facts anywhere else.

product: saaskit
org: CodeX Studio
defaults:
  timezone: Asia/Kuala_Lumpur
  currency: MYR
  locales: [en, ms, zh]
cloud: azure
database:
  providers: [sqlserver]   # PostgreSQL is not supported in this release (ADR 0011)

roles: [user, manager, admin]          # lowest to highest
plans: [lite, advanced, complete]          # lowest to highest

# services and modules answer two different questions:
#   services: what RUNS. A process with a port, a gateway route (/api/{key}/*), a container, its own schema and token audience.
#   modules:  what is SOLD and PERMISSIONED. Plans include it, users hold a role in it, it has a menu entry and a micro-frontend.
# A service hosts ("owns") zero or more modules. Business features are almost always one service owning one module with the same
# key, which is what scripts/new-module adds. The platform services below are the exceptions: tenancy hosts three modules, and
# notification hosts none (it is infrastructure nobody buys or holds a role in).

services:                              # databases: where the service keeps data (tenant is the default)
  - { key: identity,           port: 5001, owns: [access-management], databases: [tenant, catalog] }
  - { key: tenancy,            port: 5002, owns: [tenant-settings, billing, feedback], databases: [catalog] }
  - { key: notification,       port: 5003, owns: [] }
  - { key: base,               port: 5101, owns: [base] }

modules:                               # plans: which plans include the module
  - { key: access-management,  name: Access Management,  plans: [lite, advanced, complete] }
  - { key: tenant-settings,    name: Tenant Settings,    plans: [lite, advanced, complete] }
  - { key: billing,            name: Billing,            plans: [lite, advanced, complete] }
  - { key: feedback,           name: Feedback,           plans: [lite, advanced, complete] }
  - { key: base,               name: Base,               plans: [lite, advanced, complete] }
