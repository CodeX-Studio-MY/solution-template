# <auto-generated> Edit platform.yaml instead and run scripts/generate.
name: Frontend module purchase-request
on:
  push:
    branches: [main]
    paths:
      - "frontend/modules/purchase-request/**"
      - "frontend/packages/**"
      - "frontend/tooling/**"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "platform.yaml"
      - ".github/workflows/frontend-purchase-request.yml"
  pull_request:
    paths:
      - "frontend/modules/purchase-request/**"
      - "frontend/packages/**"
      - "frontend/tooling/**"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "platform.yaml"
      - ".github/workflows/frontend-purchase-request.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Typecheck, lint (boundary rules), unit tests and build, for this module and what it depends on
        run: pnpm exec turbo run typecheck lint test build --filter=@acme/mfe-purchase-request...
        working-directory: frontend
      - run: pnpm exec prettier --check modules/purchase-request
        working-directory: frontend
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
        working-directory: backend
      - name: Generated files are up to date (including the API clients)
        run: scripts/generate.sh --check --skip-compose
