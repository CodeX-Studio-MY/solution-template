# <auto-generated> Edit platform.yaml instead and run scripts/generate.
name: Containers
on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "deploy/docker/**", "platform.yaml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "deploy/docker/**", "platform.yaml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  PREFIX: ghcr.io/${{ github.repository_owner }}/saaskit

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write        # push to GHCR (main only)
      id-token: write        # signed build provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: identity, file: deploy/docker/service.Dockerfile, project: backend/src/Hosts/Identity.Host/Identity.Host.csproj, assembly: Saaskit.Identity.Host.dll }
          - { key: tenancy, file: deploy/docker/service.Dockerfile, project: backend/src/Hosts/Tenancy.Host/Tenancy.Host.csproj, assembly: Saaskit.Tenancy.Host.dll }
          - { key: notification, file: deploy/docker/service.Dockerfile, project: backend/src/Hosts/Notification.Host/Notification.Host.csproj, assembly: Saaskit.Notification.Host.dll }
          - { key: scheduler, file: deploy/docker/service.Dockerfile, project: backend/src/Scheduler/Scheduler.csproj, assembly: Saaskit.Scheduler.dll }
          - { key: migrator, file: deploy/docker/service.Dockerfile, project: backend/src/Migrator/Migrator.csproj, assembly: Saaskit.Migrator.dll }
          - { key: gateway, file: deploy/docker/gateway.Dockerfile, project: backend/src/Gateway/Gateway.csproj, assembly: '' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            PROJECT=${{ matrix.project }}
            ASSEMBLY=${{ matrix.assembly }}
          tags: ${{ env.PREFIX }}-${{ matrix.key }}:${{ github.sha }}
          load: ${{ github.ref != 'refs/heads/main' }}
          push: ${{ github.ref == 'refs/heads/main' }}
          provenance: false
      - name: Scan the image for vulnerabilities (fails on high and critical findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.PREFIX }}-${{ matrix.key }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.PREFIX }}-${{ matrix.key }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.key }}.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.key }}
          path: sbom-${{ matrix.key }}.cdx.json
      - name: Signed build provenance
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.PREFIX }}-${{ matrix.key }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attach the SBOM to the image
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.PREFIX }}-${{ matrix.key }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.key }}.cdx.json
          push-to-registry: true
