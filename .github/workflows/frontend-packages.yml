# <auto-generated> Edit platform.yaml instead and run scripts/generate.
name: Frontend packages
on:
  push:
    branches: [main]
    paths:
      - "frontend/packages/**"
      - "frontend/tooling/**"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/package.json"
      - "frontend/eslint.config.js"
      - ".github/workflows/frontend-packages.yml"
  pull_request:
    paths:
      - "frontend/packages/**"
      - "frontend/tooling/**"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/package.json"
      - "frontend/eslint.config.js"
      - ".github/workflows/frontend-packages.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # ui-kit, web-core and api-clients are used by every module, so a change checks the whole workspace.
      - run: pnpm run typecheck && pnpm run lint && pnpm run test && pnpm format:check
        working-directory: frontend
