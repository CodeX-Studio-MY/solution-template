# <auto-generated> Edit platform.yaml instead and run scripts/generate.
name: Frontend shell and end-to-end tests
on:
  push:
    branches: [main]
    paths:
      - "frontend/apps/shell/**"
      - "frontend/modules/**"
      - "frontend/packages/**"
      - "frontend/e2e/**"
      - "frontend/tooling/**"
      - "frontend/pnpm-lock.yaml"
      - ".github/workflows/frontend-shell.yml"
  pull_request:
    paths:
      - "frontend/apps/shell/**"
      - "frontend/modules/**"
      - "frontend/packages/**"
      - "frontend/e2e/**"
      - "frontend/tooling/**"
      - "frontend/pnpm-lock.yaml"
      - ".github/workflows/frontend-shell.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec turbo run typecheck lint test --filter=@acme/shell...
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend/e2e
      # The built shell and modules, served with the Gateway's CSP, with the API mocked: composition, roles, error isolation, axe.
      - run: pnpm e2e
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json
      - run: dotnet tool restore
        working-directory: backend
      - name: Generated files are up to date
        run: scripts/generate.sh --check --skip-compose
