# Template only: scripts/generate removes this file when it scaffolds a product.
# Scaffolds a throwaway product from the template exactly as a new user would, then checks that nothing of the template is left and
# that the product builds, passes its checks and has no drift. So the scaffold can never rot.
name: Init
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: template
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: template/global.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: template/frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: dotnet tool install --global Aspire.Cli --version 13.6.1
      # A fresh copy, without the template's history: what "Use this template" gives a new user.
      - run: rsync -a --exclude .git template/ product/
      - run: dotnet tool restore
        working-directory: product/backend
      - run: scripts/generate.sh --product ciproduct --org "CI Org" --plans basic,pro --modules ci-sample --yes --no-git
        working-directory: product
      - name: Nothing of the template is left
        working-directory: product
        run: |
          test ! -f .template
          test ! -f .github/workflows/init.yml
          ! grep -rIl --exclude-dir={.git,node_modules,bin,obj,dist,.turbo} -e saaskit -e Saaskit -e SAASKIT .
      - name: Running scripts/generate again only regenerates, and nothing has drifted
        run: |
          scripts/generate.sh
          scripts/generate.sh --check
        working-directory: product
      - run: dotnet test --project backend/tests/CiSample.Tests --configuration Release
        working-directory: product
