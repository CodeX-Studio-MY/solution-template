# <auto-generated> Edit platform.yaml instead and run scripts/generate.
name: Service scheduler
on:
  push:
    branches: [main]
    paths:
      - "backend/src/Scheduler/**"
      - "platform.yaml"
      - "backend/Directory.*.props"
      - "global.json"
      - "backend/BannedSymbols.txt"
      - ".github/workflows/service-scheduler.yml"
  pull_request:
    paths:
      - "backend/src/Scheduler/**"
      - "platform.yaml"
      - "backend/Directory.*.props"
      - "global.json"
      - "backend/BannedSymbols.txt"
      - ".github/workflows/service-scheduler.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
        working-directory: backend
      - run: dotnet restore backend/acme.slnx
      # Warnings are errors (analyzers, nullable, banned APIs): a warning fails the build.
      - run: dotnet build backend/acme.slnx --no-restore --configuration Release
      - name: Architecture tests
        run: dotnet test --project backend/tests/Architecture.Tests --no-build --configuration Release
      # Testcontainers starts SQL Server 2025 (and PostgreSQL 18 when platform.yaml lists it), RabbitMQ and Valkey; every listed provider runs in every test.
      - name: Tests of this service
        run: dotnet test --solution backend/acme.slnx --no-build --configuration Release --filter-trait "service=scheduler" --ignore-exit-code 8
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Generated files are up to date (including the API clients)
        run: scripts/generate.sh --check --skip-compose
