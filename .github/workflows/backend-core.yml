# <auto-generated> Edit platform.yaml instead and run scripts/generate.
name: Backend core
on:
  push:
    branches: [main]
    paths:
      - "backend/src/Core/**"
      - "backend/src/Core.*/**"
      - "backend/src/Contracts/**"
      - "backend/tools/**"
      - "backend/tests/**"
      - "backend/Directory.*"
      - "global.json"
      - "platform.yaml"
      - ".github/workflows/backend-core.yml"
  pull_request:
    paths:
      - "backend/src/Core/**"
      - "backend/src/Core.*/**"
      - "backend/src/Contracts/**"
      - "backend/tools/**"
      - "backend/tests/**"
      - "backend/Directory.*"
      - "global.json"
      - "platform.yaml"
      - ".github/workflows/backend-core.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
        working-directory: backend
      - run: dotnet restore backend/acme.slnx
      - run: dotnet build backend/acme.slnx --no-restore --configuration Release
      # Everything, on both database providers.
      - run: dotnet test --solution backend/acme.slnx --no-build --configuration Release
