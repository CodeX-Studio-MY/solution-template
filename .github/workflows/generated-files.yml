# <auto-generated> Edit platform.yaml instead and run scripts/generate.
name: Generated files
on:
  push:
    branches: [main]
    paths:
      - "platform.yaml"
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/generated-files.yml"
  pull_request:
    paths:
      - "platform.yaml"
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/generated-files.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
        working-directory: backend
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # `aspire publish` produces deploy/docker-compose.yml from the AppHost.
      - run: dotnet tool install --global Aspire.Cli --version 13.6.1
      # Everything derived from platform.yaml, the configuration schema, the backend and the AppHost must be committed.
      - run: scripts/generate.sh --check
